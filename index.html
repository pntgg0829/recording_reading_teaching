<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>語文朗讀教室｜閱讀理解｜流暢度評分</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:"微軟正黑體",sans-serif;
        }
        body{
            background: linear-gradient(120deg, #fff5f5, #fff0e8);
            padding:30px 15px;
            max-width:1000px;
            margin:0 auto;
        }
        .box{
            background:#ffffff;
            border-radius:20px;
            padding:30px;
            box-shadow: 0 8px 25px rgba(180, 80, 80, 0.15);
        }
        .title-wrap{
            display:flex;
            align-items:center;
            justify-content:center;
            gap:15px;
            margin-bottom:25px;
        }
        h2{
            color:#b83b3b;
            font-size:24px;
            letter-spacing:2px;
        }
        .article-tab{
            display:flex;
            flex-wrap:wrap;
            gap:12px;
            margin-bottom:25px;
            justify-content:center;
        }
        .tab-item{
            padding:10px 20px;
            border:2px solid #e87070;
            border-radius:30px;
            cursor:pointer;
            font-size:15px;
            color:#b83b3b;
            transition:all 0.3s ease;
        }
        .tab-item.active{
            background:#e87070;
            color:#fff;
        }
        .tab-item:hover:not(.active){
            background:#ffe8e8;
        }
        .article-content{
            padding:25px;
            border:2px solid #f0b0b0;
            border-radius:16px;
            min-height:200px;
            margin-bottom:18px;
            line-height:2;
            font-size:18px;
            color:#333;
            white-space:pre-wrap;
            background:#fffafa;
        }
        /* 阅读理解选择题样式 */
        .reading-comp{
            background:#fff9f0;
            border-radius:20px;
            padding:20px;
            margin:20px 0 20px;
            border-left:8px solid #e87070;
            box-shadow:0 2px 8px rgba(0,0,0,0.05);
        }
        .reading-comp h3{
            color:#b83b3b;
            font-size:20px;
            margin-bottom:12px;
            display:flex;
            align-items:center;
            gap:8px;
        }
        .quiz-item{
            background:white;
            border-radius:16px;
            padding:15px;
            margin-bottom:18px;
            box-shadow:0 1px 4px rgba(0,0,0,0.08);
        }
        .quiz-question{
            font-weight:bold;
            color:#2d3e50;
            margin-bottom:12px;
            font-size:16px;
        }
        .quiz-options{
            display:flex;
            flex-direction:column;
            gap:10px;
            margin-bottom:12px;
        }
        .quiz-option{
            display:flex;
            align-items:center;
            gap:10px;
            cursor:pointer;
            padding:5px;
            border-radius:30px;
        }
        .quiz-option:hover{
            background:#fef2e6;
        }
        .quiz-option input{
            width:18px;
            height:18px;
            cursor:pointer;
        }
        .quiz-feedback{
            font-size:14px;
            margin-top:8px;
            padding:8px;
            border-radius:12px;
            background:#f5f5f5;
            display:none;
        }
        .quiz-feedback.correct{
            background:#d4edda;
            color:#155724;
            display:block;
        }
        .quiz-feedback.wrong{
            background:#f8d7da;
            color:#721c24;
            display:block;
        }
        .quiz-score{
            text-align:right;
            font-weight:bold;
            color:#b83b3b;
            margin-top:12px;
            font-size:16px;
        }

        .student-row{
            display:flex;
            justify-content:center;
            align-items:center;
            gap:12px;
            margin:18px auto 8px;
            padding:14px 18px;
            background:#fff9f0;
            border:2px solid #ffd2b8;
            border-radius:18px;
            max-width:520px;
        }
        .student-row label{
            color:#8a3a22;
            font-weight:bold;
            font-size:16px;
        }
        .student-row select{
            min-width:220px;
            padding:10px 16px;
            border:2px solid #f0b0b0;
            border-radius:30px;
            background:white;
            color:#4a3a32;
            font-size:16px;
            font-weight:bold;
            outline:none;
            cursor:pointer;
        }
        .student-row select:focus{
            border-color:#e87070;
            box-shadow:0 0 0 3px rgba(232,112,112,0.15);
        }

        .count-tip{
            text-align:center;
            font-size:17px;
            color:#d04848;
            font-weight:bold;
            margin-bottom:12px;
        }
        .tip{
            text-align:center;
            color:#777;
            margin:12px 0;
            font-size:15px;
        }
        .btn-group{
            display:flex;
            gap:15px;
            justify-content:center;
            margin:25px 0;
            flex-wrap:wrap;
        }
        button{
            padding:12px 26px;
            font-size:16px;
            border:none;
            border-radius:30px;
            cursor:pointer;
            transition:all 0.25s ease;
            font-weight:500;
        }
        .start{
            background:#52b788;
            color:#fff;
        }
        .start:hover{
            background:#409c70;
        }
        .stop{
            background:#e56b6b;
            color:#fff;
        }
        .stop:hover{
            background:#d04848;
        }
        .play{
            background:#5086d8;
            color:#fff;
        }
        .play:hover{
            background:#3c6fb8;
        }
        button:disabled{
            background:#cccccc;
            color:#fff;
            cursor:not-allowed;
            transform:none;
        }
        .record-list{
            margin-top:35px;
            border-top:1px dashed #e0c0c0;
            padding-top:25px;
        }
        .list-title{
            font-size:18px;
            color:#b83b3b;
            margin-bottom:18px;
            font-weight:bold;
        }
        .art-block{
            border:1px solid #f2d2d2;
            border-radius:14px;
            padding:16px;
            margin-bottom:15px;
            background:#fff8f8;
        }
        .art-title{
            font-weight:bold;
            color:#a03030;
            margin-bottom:10px;
            font-size:16px;
        }
        .student-record-group{
            background:#fffdf8;
            border:1px solid #f6dfc8;
            border-radius:14px;
            padding:12px;
            margin:12px 0;
        }
        .student-record-title{
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:10px;
            color:#7b341e;
            font-weight:bold;
            margin-bottom:8px;
            flex-wrap:wrap;
        }
        .record-badge{
            background:#ffefdd;
            color:#b45309;
            border:1px solid #ffd6a3;
            border-radius:999px;
            padding:4px 10px;
            font-size:13px;
        }
        .record-summary{
            background:#fff7ed;
            border:1px dashed #f2b9a0;
            color:#8a3b12;
            border-radius:14px;
            padding:10px 12px;
            margin-bottom:12px;
            line-height:1.7;
            font-size:14px;
        }
        .rec-meta{
            display:flex;
            flex-direction:column;
            gap:3px;
        }
        .rec-time{
            font-size:12px;
            color:#8b7b72;
        }
        .rec-row{
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:8px 0;
            border-bottom:1px dashed #f5e0e0;
        }
        .rec-row:last-child{
            border:none;
        }
        .rec-row button{
            padding:4px 12px;
            font-size:13px;
            margin-left:6px;
            border-radius:20px;
        }
        .loading{
            color:#f59e0b;
            font-weight:bold;
        }


        /* ================= 語文教學風格與左右雙欄 ================= */
        body{
            background:
                radial-gradient(circle at 15% 10%, rgba(255,214,165,.55), transparent 28%),
                radial-gradient(circle at 85% 15%, rgba(255,184,162,.45), transparent 26%),
                linear-gradient(135deg,#fffaf3,#fff1ea 55%,#fff7f0);
            max-width:1180px;
        }
        .box{
            border:1px solid #ffe1cf;
        }
        .learning-layout{
            display:grid;
            grid-template-columns:minmax(0,1.05fr) minmax(360px,.95fr);
            gap:24px;
            align-items:start;
            margin:22px 0;
        }
        .teaching-card{
            background:#fffdf9;
            border:2px solid #ffd6bf;
            border-radius:24px;
            padding:18px;
            box-shadow:0 8px 22px rgba(165,90,55,.08);
            position:relative;
        }
        .panel-label{
            display:inline-flex;
            align-items:center;
            gap:6px;
            background:#ff946f;
            color:white;
            padding:7px 16px;
            border-radius:999px;
            font-weight:bold;
            font-size:15px;
            margin-bottom:12px;
            box-shadow:0 4px 10px rgba(255,148,111,.25);
        }
        .article-content{
            border:0;
            background:linear-gradient(180deg,#fffefa,#fff8f1);
            min-height:560px;
            margin-bottom:12px;
            font-size:20px;
            line-height:2.25;
            color:#4a362c;
            letter-spacing:.5px;
            box-shadow:inset 0 0 0 1px #ffe0c9;
        }
        .keyword-note{
            color:#8a4b2c;
            background:#fff4d8;
            border:1px dashed #efb96f;
            border-radius:14px;
            padding:10px 14px;
            line-height:1.6;
            font-size:14px;
        }
        mark.keyword{
            background:#ffe58f;
            color:#5d3600;
            padding:1px 5px;
            border-radius:7px;
            box-shadow:0 1px 0 rgba(120,80,0,.15);
        }
        .reading-comp{
            margin:0;
            border-left:0;
            border:0;
            background:linear-gradient(180deg,#fffaf4,#fff4ea);
            min-height:560px;
            box-shadow:inset 0 0 0 1px #ffe0c9;
        }
        .reading-comp h3{
            border-bottom:2px dashed #efb99c;
            padding-bottom:12px;
        }
        .quiz-item{
            border:1px solid #ffe3d0;
        }
        .demo{
            background:#9b5de5;
            color:white;
        }
        .demo:hover{
            background:#7b42c8;
        }
        .score-panel{
            background:#fffdf7;
            border:2px solid #ffd7a8;
            border-radius:22px;
            padding:20px;
            margin:18px 0 28px;
            box-shadow:0 6px 18px rgba(158,102,32,.08);
        }
        .score-title{
            color:#a85f12;
            font-weight:bold;
            font-size:18px;
            margin-bottom:14px;
        }
        .score-grid{
            display:grid;
            grid-template-columns:repeat(4,1fr);
            gap:12px;
            margin-bottom:12px;
        }
        .score-grid div{
            background:white;
            border:1px solid #ffe2ba;
            border-radius:16px;
            padding:14px 8px;
            text-align:center;
        }
        .score-grid span{
            display:block;
            color:#b83b3b;
            font-size:24px;
            font-weight:bold;
            margin-bottom:4px;
        }
        .score-grid small{
            color:#8b6f5c;
            font-size:13px;
        }
        #scoreAdvice{
            color:#6f5648;
            line-height:1.7;
            font-size:15px;
        }
        .tablet-mode-tip{
            display:none;
        }
        @media (min-width:700px) and (max-width:1024px) and (orientation:portrait){
            body{
                max-width:820px;
                padding:18px 14px;
            }
            .box{
                padding:22px;
            }
            .title-wrap{
                flex-wrap:wrap;
            }
            h2{
                font-size:22px;
                text-align:center;
            }
            .learning-layout{
                grid-template-columns:1fr;
                gap:18px;
            }
            .article-content,.reading-comp{
                min-height:auto;
            }
            .article-content{
                font-size:21px;
                line-height:2.3;
            }
            .score-grid{
                grid-template-columns:repeat(2,1fr);
            }
        }
        @media(max-width:699px){
            body{
                padding:12px 8px;
            }
            .box{
                padding:16px;
                border-radius:18px;
            }
            h2{
                font-size:18px;
                text-align:center;
            }
            .learning-layout{
                grid-template-columns:1fr;
            }
            .article-content,.reading-comp{
                min-height:auto;
            }
            .article-content{
                font-size:18px;
                line-height:2.05;
                padding:20px;
            }
            .score-grid{
                grid-template-columns:repeat(2,1fr);
            }
        }

    </style>
</head>
<body>
    <div class="box">
        <div class="title-wrap">
            <h2>📖 語文朗讀教室｜閱讀理解 × 流暢度評分</h2>
        </div>

        <div class="article-tab" id="articleTab">
            <div class="tab-item" data-id="art1">做油角</div>
            <div class="tab-item" data-id="art2">逛年宵市場</div>
            <div class="tab-item" data-id="art3">過新年</div>
            <div class="tab-item" data-id="art4">春節記事</div>
        </div>
        <div class="learning-layout">
            <section class="left-panel teaching-card">
                <div class="panel-label">📘 課文朗讀區</div>
                <div class="article-content" id="articleShow">請點擊上方文章，開始朗讀錄音練習</div>
                <div class="keyword-note">✍️ 重點詞語已以黃色標示，朗讀時請注意語氣和停頓。</div>
            </section>

            <section class="right-panel teaching-card">
                <!-- 閱讀理解選擇題板塊（學生只可作答，不可編輯） -->
                <div class="reading-comp" id="readingComp">
                    <h3>📚 閱讀理解 · 選擇題（共5題）</h3>
                    <div id="questionsArea"></div>
                    <div class="quiz-score" id="quizScore"></div>
                </div>
            </section>
        </div>

        <div class="count-tip" id="countTip">目前文章可錄製次數：0/3</div>
        <p class="tip" id="tipText">選擇文章後，點擊開始錄音朗讀</p>

        <div class="student-row">
            <label for="studentNameInput">學生姓名：</label>
            <select id="studentNameInput" aria-label="選擇學生姓名">
                <option value="">請選擇學生</option>
                <option value="Elvis">Elvis</option>
                <option value="Hannah">Hannah</option>
                <option value="Yannie">Yannie</option>
            </select>
        </div>

        <div class="btn-group">
            <button class="demo" id="demoReadBtn" disabled>🔊 AI示範朗讀</button>
            <button class="start" id="startBtn" disabled>開始錄音</button>
            <button class="stop" id="stopBtn" disabled>停止錄音</button>
            <button class="play" id="playBtn" disabled>播放本次錄音</button>
        </div>

        <div class="score-panel" id="scorePanel">
            <div class="score-title">⭐ 朗讀流暢度評分</div>
            <div class="score-grid">
                <div><span id="scoreTotal">--</span><small>總分</small></div>
                <div><span id="scoreSpeed">--</span><small>語速</small></div>
                <div><span id="scoreVolume">--</span><small>音量</small></div>
                <div><span id="scoreComplete">--</span><small>完整度</small></div>
            </div>
            <p id="scoreAdvice">完成一次錄音後，系統會根據朗讀時間、音量穩定度和文章長度給出初步流暢度建議。</p>
        </div>

        <div class="record-list">
            <div class="list-title">🎙️ 學生錄音紀錄（Google Drive 雲端保存，可分次播放）</div>
            <div id="recordContainer"></div>
        </div>

        <audio id="audioPlay"></audio>
    </div>

    <script>
        // ======================= 文章資料 =======================
        const articleList = {
            art1: {
                title: "做油角",
                keywords: ["春節", "做油角", "不耐煩", "沒耐性", "決心", "花邊"],
                text: "春節快到了，媽媽忙着準備過年食品，美兒看到媽媽做油角，嚷着要幫忙。可是她只做了一會兒，就不耐煩地說：「油角的花邊這麼難捏，我不做了！」\n媽媽對她說：「做事怎可以這麼沒耐性？只要有決心，甚麼難題都可以解決！」\n媽媽細心地拿起麵粉團，從右至左，用手指輕輕在麵粉團的邊上捏呀捏，不到一會兒，油角長出花邊來了。"
            },
            art2: {
                title: "逛年宵市場",
                keywords: ["大除夕", "年宵市場", "維多利亞公園", "熱鬧", "水泄不通", "桃花", "水仙", "紅包"],
                text: "大除夕，我們一家人吃過豐富的年夜飯後，一塊兒到維多利亞公園逛年宵市場去。\n年宵市場裏十分熱鬧，有各色各樣的攤子，有賣鮮花的，有賣玩具的，也有賣日用品的，吸引了不少遊人，整條通道擠得水泄不通。\n我們來到賣年花的攤子，那裏放滿了不同種類的年花，全都美得叫人不知該選擇哪種才好。爸爸喜歡紅紅的桃花，媽媽說清香的水仙最好，而我則想買金黃的桔子。\n我們問妹妹喜歡甚麼花，妹妹卻說：「我不喜歡年花，我只喜歡紅包！」這句話逗得大家咯咯地笑了。"
            },
            art3: {
                title: "過新年",
                keywords: ["年初一", "新年氣氛", "揮春", "桃花", "拜年", "紅包", "賀年食品"],
                text: "今天是年初一，家裏充滿了新年氣氛。門上貼上了鮮紅的揮春，花瓶裏的桃花開得又大又紅。桌子上放了一個糖果盒，裏面放滿了好吃的糖果。\n哥哥和我大清早便起床，穿上新衣服，一起向爸爸、媽媽拜年。我們興奮地對爸媽說：「祝爸爸、媽媽身體健康、萬事如意！」爸媽也笑着對我們說：「好孩子，祝你們學業進步、快高長大！」然後從懷中掏出紅包送給我們。\n中午，媽媽準備了賀年食品給我們吃，蘿蔔糕和年糕都美味極了！我們吃完，便一起到爺爺家拜年。啊！我真期待能早點見到很久沒見的堂姐呢！"
            },
            art4: {
                title: "春節記事",
                keywords: ["年二十八", "祖居", "躍躍欲試", "爆竹聲", "敬茶", "傳統", "温馨"],
                text: "年二十八那天，爸爸帶我們回到鄉間的祖居度歲，爺爺、奶奶、伯父和堂兄笑吟吟地在門前迎接我們。\n吃過午飯後，奶奶、伯母和媽媽一起做油角，我和妹妹都躍躍欲試。誰知我們做的油角不是太大，就是太小，而且形狀古怪。媽媽把這些油角放進油裏一炸，餡兒都漏了出來。雖然如此，我和妹妹都為了這次的嘗試而感到很快樂呢。\n年初一早上，劈劈啪啪的爆竹聲把我們吵醒了。吃早餐前，伯父和伯母、爸爸和媽媽在大廳裏分別向爺爺、奶奶敬茶。我想，傳統的新年禮節是多麼隆重啊！\n我和妹妹向長輩拜過年後，就到外面玩耍。我踏着門前紅色的爆竹紙屑，細看門上鮮紅的春聯，深深感受到春節那份暖意。鄉間的新年極富傳統的節日氣氛，而且親友們聚首一堂，感覺更加温馨呢。"
            }
        };

        // ======================= 硬編碼閱讀理解選擇題（每篇文章5題） =======================
        const readingQuiz = {
            art1: [
                { question: "美兒一開始為什麼不耐煩？", options: ["A. 媽媽不讓她幫忙", "B. 油角的花邊太難捏", "C. 油角不好吃", "D. 她想出去玩"], answer: "B" },
                { question: "媽媽對美兒說了什麼道理？", options: ["A. 做事要快", "B. 要有決心，難題都能解決", "C. 油角不重要", "D. 不要學做油角"], answer: "B" },

        function escapeHtml(str) {
            return str.replace(/[&<>"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[ch]));

        function renderArticleText(articleId) {
            const article = articleList[articleId];

            let safeText = escapeHtml(article.text);
            const keywords = [...(article.keywords || [])].sort((a,b) => b.length - a.length);
            keywords.forEach(word => {
                const safeWord = escapeHtml(word);
                const reg = new RegExp(safeWord.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), "g");
                safeText = safeText.replace(reg, `<mark class="keyword">${safeWord}</mark>`);
            });
            return safeText;
        }

        async function scoreReadingBlob(blob, articleId, startTime, endTime) {
            const duration = Math.max(1, (endTime - startTime) / 1000);
            const target = getEstimatedSeconds(articleId);
            const speedRatio = duration / target;
            let speedScore = Math.round(100 - Math.min(55, Math.abs(speedRatio - 1) * 90));
            speedScore = Math.max(45, Math.min(100, speedScore));

            let volumeScore = 75;
            try {
                const arrayBuffer = await blob.arrayBuffer();
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                const ctx = new AudioCtx();
                const audioBuffer = await ctx.decodeAudioData(arrayBuffer.slice(0));
                const data = audioBuffer.getChannelData(0);
                let sum = 0;
                for (let i = 0; i < data.length; i += 200) sum += data[i] * data[i];
                const rms = Math.sqrt(sum / Math.max(1, Math.floor(data.length / 200)));
                volumeScore = Math.round(Math.min(100, Math.max(45, rms * 900)));
                await ctx.close();
            } catch(e) {
                volumeScore = 75;
            }

            const completeScore = duration >= target * 0.65 ? 92 : Math.max(45, Math.round(duration / (target * 0.65) * 92));
            const total = Math.round(speedScore * 0.4 + volumeScore * 0.3 + completeScore * 0.3);
            document.getElementById("scoreTotal").innerText = total;
            document.getElementById("scoreSpeed").innerText = speedScore;
            document.getElementById("scoreVolume").innerText = volumeScore;
            document.getElementById("scoreComplete").innerText = completeScore;

            let advice = "";
            if (total >= 88) advice = "表現很好！朗讀速度自然，聲音清楚，可以再加強感情和停頓。";
            else if (total >= 75) advice = "表現不錯！建議留意句號、問號和感嘆號位置，讓停頓更明顯。";
            else advice = "還可以再練習。建議先聽 AI 示範朗讀，再分段朗讀，保持聲音穩定。";
            document.getElementById("scoreAdvice").innerText = `錄音約 ${Math.round(duration)} 秒；建議朗讀時間約 ${target} 秒。${advice}`;
        }

        function loadRecordListByJsonp() {
            return new Promise((resolve, reject) => {
                const callbackName = "driveRecordCallback_" + Date.now() + "_" + Math.floor(Math.random() * 10000);
                const script = document.createElement("script");
                const timer = setTimeout(() => {
                    cleanup();
                    reject(new Error("讀取 Google Drive 錄音清單逾時"));
                }, 15000);

                function cleanup() {
                    clearTimeout(timer);
                    if (script.parentNode) script.parentNode.removeChild(script);
                    try { delete window[callbackName]; } catch(e) { window[callbackName] = undefined; }
                }

                window[callbackName] = data => {
                    cleanup();
                    if (!data || data.success === false) {
                        reject(new Error(data && data.message ? data.message : "讀取錄音清單失敗"));
                        return;
                    }
                    resolve(data.records || []);
                };

                script.onerror = () => {
                    cleanup();
                    reject(new Error("無法連接 Google Apps Script，請檢查部署權限是否為 Anyone。"));
                };

                script.src = GOOGLE_SCRIPT_URL + "?action=list&callback=" + encodeURIComponent(callbackName) + "&t=" + Date.now();
                document.body.appendChild(script);
            });
        }

        async function getCloudData() {
            const data = initRecordData();
            try {
                const records = await loadRecordListByJsonp();
                records.sort((a,b) => (a.createdAtMs || 0) - (b.createdAtMs || 0));
                records.forEach(record => {
                    const aid = record.articleId || "unknown";
                    if (!data[aid]) data[aid] = [];
                    data[aid].push({
                        id: record.fileId,
                        url: record.directUrl || record.fileUrl,
                        fileUrl: record.fileUrl,
                        fileName: record.fileName,

        function blobToBase64(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onloadend = () => {
                    const result = reader.result || "";
                    resolve(String(result).split(",")[1] || "");
                };
                reader.onerror = () => reject(reader.error || new Error("錄音轉換失敗"));
                reader.readAsDataURL(blob);
            });
        }

        function postToGoogleDriveByForm(payload) {
            return new Promise((resolve, reject) => {
                const iframeName = "driveUploadFrame_" + Date.now() + "_" + Math.floor(Math.random() * 10000);
                const iframe = document.createElement("iframe");
                iframe.name = iframeName;
                iframe.style.display = "none";
                document.body.appendChild(iframe);

                const form = document.createElement("form");
                form.method = "POST";
                form.action = GOOGLE_SCRIPT_URL;
                form.target = iframeName;
                form.enctype = "application/x-www-form-urlencoded";
                form.style.display = "none";

                Object.keys(payload).forEach(key => {
                    const input = document.createElement("input");
                    input.type = "hidden";
                    input.name = key;
                    input.value = payload[key];
                    form.appendChild(input);
                });

                document.body.appendChild(form);

                const timer = setTimeout(() => {
                    cleanup();
                    reject(new Error("上傳逾時：請檢查 Apps Script 是否已重新部署為最新版本，或錄音檔是否太大。"));
                }, 45000);

                let loadedOnce = false;
                iframe.onload = () => {
                    if (loadedOnce) return;
                    loadedOnce = true;
                    clearTimeout(timer);
                    setTimeout(() => {
                        cleanup();
                        resolve(true);
                    }, 500);
                };

                function cleanup() {
                    if (form.parentNode) form.parentNode.removeChild(form);
                    if (iframe.parentNode) iframe.parentNode.removeChild(iframe);
                }

                form.submit();
            });
        }

                audioBase64: audioBase64
            };

            tipText.innerHTML = '<span class="loading">☁️ 正在上傳錄音到 Google Drive...</span>';
            await postToGoogleDriveByForm(payload);
            return URL.createObjectURL(blob);
        }

        startBtn.onclick = async function() {

                tipText.innerText = "請先選擇一篇文章。";
                return;
            }

            if (!studentNameInput.value.trim()) {
                tipText.innerText = "請先選擇學生姓名，方便老師查看錄音。";
                studentNameInput.focus();

            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                tipText.innerText = "❌ 目前瀏覽器或開啟方式不支援錄音。請用 Chrome / Edge / Safari，並以 https:// 或 localhost 開啟網頁。";
                return;
            }

            if (location.protocol !== "https:" && location.hostname !== "localhost" && location.hostname !== "127.0.0.1") {
                tipText.innerText = "⚠️ 瀏覽器可能會阻止麥克風。請把網頁放到 HTTPS 網站，或用 localhost 開啟。";
            }

            let data = await getCloudData();
            if (!data[currentArticleId]) data[currentArticleId] = [];
            const studentName = getCurrentStudentName();
            const ownRecords = getStudentArticleRecords(data, currentArticleId, studentName);
            if (ownRecords.length >= MAX_TIMES) {
                tipText.innerText = `❌ ${studentName} 本篇已達 ${MAX_TIMES} 次錄製上限`;
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({audio:true});
                const options = MediaRecorder.isTypeSupported("audio/webm") ? { mimeType:"audio/webm" } : undefined;
                mediaRecorder = new MediaRecorder(stream, options);
                audioChunks = [];

                mediaRecorder.ondataavailable = e => {
                    if (e.data && e.data.size > 0) audioChunks.push(e.data);
                };

                mediaRecorder.onerror = e => {
                    console.error(e);
                    tipText.innerText = "❌ 錄音時發生錯誤，請重新整理後再試。";
                    startBtn.disabled = false;
                    stopBtn.disabled = true;
                };

                mediaRecorder.onstop = async () => {
                    recordEndTime = Date.now();
                    stream.getTracks().forEach(track => track.stop());

                    if (!audioChunks.length) {
                        tipText.innerText = "❌ 沒有收到錄音資料，請檢查麥克風權限後再試。";
                        startBtn.disabled = false;
                        stopBtn.disabled = true;
                        return;
                    }

                    try {
                        const mimeType = mediaRecorder.mimeType || "audio/webm";
                        let blob = new Blob(audioChunks, {type:mimeType});
                        await scoreReadingBlob(blob, currentArticleId, recordStartTime, recordEndTime);
                        let url = await uploadAudioToDrive(blob);
                        currentUrl = url;
                        audioPlay.src = url;

                        playBtn.disabled = false;
                        tipText.innerText = "✅ 錄音已送到 Google Drive，正在更新清單...";
                        setTimeout(async () => {
                            await renderRecord();
                            await refreshCount();
                            tipText.innerText = "✅ 錄音已保存到老師的 Google Drive，其他裝置打開同一網址也可播放";
                        }, 2500);
                    } catch (err) {
                        console.error(err);
                        tipText.innerText = "❌ 上傳 Google Drive 失敗：" + (err.message || err.name || "未知錯誤");
                    }
                };

                recordStartTime = Date.now();
                window.speechSynthesis.cancel();
                mediaRecorder.start();
                startBtn.disabled = true;
                stopBtn.disabled = false;
                playBtn.disabled = true;
                tipText.innerText = "🎤 正在錄音，請大聲完整朗讀文章";
            } catch (err) {
                console.error(err);
                if (err.name === "NotAllowedError" || err.name === "PermissionDeniedError") {
                    tipText.innerText = "❌ 麥克風權限被拒絕。請在瀏覽器網址列允許麥克風，然後重新點擊開始錄音。";
                } else if (err.name === "NotFoundError" || err.name === "DevicesNotFoundError") {
                    tipText.innerText = "❌ 找不到麥克風。請確認裝置已連接麥克風。";
                } else {
                    tipText.innerText = "❌ 無法開始錄音：" + (err.message || err.name || "未知錯誤");
                }
                startBtn.disabled = false;
                stopBtn.disabled = true;
            }
        }

        stopBtn.onclick = function() {
            if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
                startBtn.disabled = false;
                stopBtn.disabled = true;
            }
        }

        playBtn.onclick = function() {
            audioPlay.play();
            tipText.innerText = "🔊 播放本次朗讀錄音";
        }

        studentNameInput.addEventListener("change", () => {
            refreshCount();
            renderRecord();
        });

        // 初始化
        document.querySelector(".tab-item").click();
        renderRecord();
    </script>
</body>
</html>
